[project]
name = "intelli-shield"
version = "0.1.0"
description = "Intelli-Shield: CCTV & Edge-Cloud Dual-Process Safety Warning System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0,<5.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
tools = [
    "pillow>=9.0.0",
]
yolo = [
    "ultralytics>=8.0.0",
]
dev = [
    "pillow>=9.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.9.0",
]

[dependency-groups]
dev = [
    "pillow>=9.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.9.0",
]
tools = [
    "pillow>=9.0.0",
]
yolo = [
    "ultralytics>=8.0.0",
]

[tool.uv]
package = false
default-groups = ["dev", "tools"]

[tool.uv.workspace]
members = ["cloud"]
