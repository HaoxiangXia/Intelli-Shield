[project]
name = "center-server"
version = "0.1.0"
description = "Forklift safety hub cloud backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.12",
    "openai>=2.30.0",
    "paho-mqtt>=2.1.0",
    "python-multipart>=0.0.20",
    "python-socketio>=5.13.0",
    "python-dotenv>=1.0.1",
    "requests>=2.33.1",
    "uvicorn>=0.34.2",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
package = false
